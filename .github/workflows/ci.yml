name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & self-tests
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Self-tests
        run: ./test.sh

      - name: Build app bundle
        run: |
          set +e
          ./build.sh > build.log 2>&1
          status=$?
          cat build.log
          if [ "$status" -ne 0 ]; then
            echo "::error title=build.sh failed::$(tail -n 1 build.log)"
          fi
          exit "$status"

      - name: Package app
        run: ditto -c -k --keepParent dist/GtrBoard.app dist/GtrBoard.app.zip

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: GtrBoard-macOS
          path: dist/GtrBoard.app.zip
          if-no-files-found: error
