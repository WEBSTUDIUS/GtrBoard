name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build, test and publish
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Self-tests
        run: ./test.sh

      - name: Build app bundle
        run: ./build.sh

      - name: Package app
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="dist/GtrBoard-${VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/GtrBoard.app" "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          ls -lh dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="dist/GtrBoard-${VERSION}.zip"
          gh release create "${GITHUB_REF_NAME}" \
            "$ZIP" "$ZIP.sha256" \
            --title "GtrBoard ${VERSION}" \
            --notes-file .github/release-notes.md
