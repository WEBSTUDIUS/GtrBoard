name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build, test and publish
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Self-tests
        run: ./test.sh

      - name: Build app bundle
        run: ./build.sh

      - name: Package app
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="dist/GtrBoard-${VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/GtrBoard.app" "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          ls -lh dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="dist/GtrBoard-${VERSION}.zip"
          REF="refs/tags/${GITHUB_REF_NAME}"
          REMOTE_COMMIT="$(git ls-remote origin "$REF" "${REF}^{}" |
            awk '$2 ~ /\^\{\}$/ { peeled = $1 } { sha = $1 } END { print (peeled ? peeled : sha) }')"
          if [[ "$REMOTE_COMMIT" != "$(git rev-parse HEAD)" ]]; then
            echo "Tag moved during the build. Skipping publication."
            exit 0
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "$ZIP" "$ZIP.sha256" --clobber
            gh release edit "${GITHUB_REF_NAME}" \
              --title "GtrBoard ${VERSION}" \
              --notes-file .github/release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              "$ZIP" "$ZIP.sha256" \
              --verify-tag \
              --title "GtrBoard ${VERSION}" \
              --notes-file .github/release-notes.md
          fi
